[package]
name = "xipe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/xipe"
homepage = "https://github.com/savageAZfck/xipe"
license = "MIT"
description = "Constitutional self-modification: every change to a system's own behavior-bearing state is a signed amendment — proposed, deliberated, ratified by tier, applied, measured, and anchored in a hash-chained journal. Named for Xipe Totec, who shed his skin as sacred rite."
keywords = ["governance", "self-modification", "audit", "agent", "hash-chain"]
categories = ["cryptography", "data-structures"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
ed25519 = ["dep:ed25519-dalek", "dep:rand"]

[[bench]]
name = "journal"
harness = false
